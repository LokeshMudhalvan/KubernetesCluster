apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications 
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/LokeshMudhalvan/KubernetesCluster.git
    targetRevision: main
    path: argo-apps
    directory: 
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argo
  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true