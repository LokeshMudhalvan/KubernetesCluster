apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn 
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: longhorn 
      repoURL: https://charts.longhorn.io
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn 
        valueFiles: 
          - $values/helm/system/longhorn.yml
    - repoURL: https://github.com/LokeshMudhalvan/KubernetesCluster.git
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn
  syncPolicy: 
    automated: 
      prune: true
      selfHeal: true