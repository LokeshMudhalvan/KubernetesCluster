apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-cert 
  namespace: traefik
spec:
  isCA: true
  commonName: my-selfsigned-ca
  secretName: root-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: root-cert-issuer
    kind: ClusterIssuer
    group: cert-manager.io