global:
  enabled: true

injector:
  enabled: false 

server:
  logLevel: info
  logFormat: standard
  dataStorage: 
    size: 5Gi 
  httproute:
    enabled: true
    activeService: true
    hostnames: 
      - vault.example.com
    parentRefs: 
      - group: gateway.networking.k8s.io	
        kind: Gateway 
        name: traefik
        namespace: traefik 
    matches:
      - path:
          type: PathPrefix
          value: /
  postStart:
    - /bin/sh
    - -c
    - /vault/startup.sh
  extraVolumes: 
    - type: configMap
      name: startup-script
      path: /vault

  standalone:
    enabled: true 

ui:
  enabled: true