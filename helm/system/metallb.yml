rbac:
  create: true

controller:
  enabled: true
  logLevel: info
  webhookMode: enabled

  image:
    repository: quay.io/metallb/controller
    tag: v0.16
    pullPolicy: IfNotPresent

  strategy:
    type: RollingUpdate

  serviceAccount:
    create: true

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
  
speaker:
  enabled: true
  logLevel: info
  tolerateMaster: true

  memberlist:
    enabled: true
    mlBindPort: 7946
    mlBindAddrOverride: ""
    mlSecretKeyPath: "/etc/ml_secret_key"

  excludeInterfaces:
    enabled: true

  image:
    repository: quay.io/metallb/speaker
    tag: v0.16
    pullPolicy: IfNotPresent

  updateStrategy:
    type: RollingUpdate

  serviceAccount:
    create: true

  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged 
  
crds:
  enabled: true

frrk8s:
  enabled: true